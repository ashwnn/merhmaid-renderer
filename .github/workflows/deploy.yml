name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npx vite build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # `configure-pages` does not switch an *existing* Pages site over to
      # Actions-based deployments (its `enablement` input needs admin rights),
      # and a branch-sourced site silently ignores the artifact uploaded below —
      # leaving the repository root online instead of the built app. Fail loudly
      # instead of shipping a blank page.
      - name: Verify the Pages source is "GitHub Actions"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo missing)"
          echo "Pages build_type: ${build_type}"
          if [ "${build_type}" != "workflow" ]; then
            echo "::error title=Pages source is not 'GitHub Actions'::This workflow publishes dist/ as a Pages artifact, but the Pages site uses build_type=${build_type}. Choose Settings -> Pages -> Build and deployment -> Source: 'GitHub Actions', then re-run this workflow."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
